
services:
  service-api:
    build:
      context: ../../Downloads/SnoozBackendApis-master
      dockerfile: ../../Downloads/SnoozBackendApis-master/docker/api.dev.Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - api-network
    volumes:
      - .:/app

  postgres:
    image: postgres:latest
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - api_postgres:/var/lib/postgresql/data
    networks:
      - api-network

networks:
  api-network:
    driver: bridge

volumes:
  api_postgres: {}